# Trading Factory harness - free/self-hosted stack.
# Runs on any always-on host (Oracle Cloud Always Free ARM VM, Render, a VPS, or locally).
# No commercial managed services required: Postgres + the Node worker + the Next.js dashboard.
#
#   docker compose up -d --build
#   docker compose logs -f worker
#   docker compose logs -f web
#
# Dashboard: http://<host>:3000  (create the first login with `npm --prefix web run create-user`)
# Credentials come from a .env file next to this file (see .env.example). Never commit it.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tf}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tf_local_password}
      POSTGRES_DB: ${POSTGRES_DB:-tradingfactory}
    volumes:
      - tf-db:/var/lib/postgresql/data
      # Applied automatically on first boot of an empty volume.
      - ./harness/db/schema.sql:/docker-entrypoint-initdb.d/10-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tf} -d ${POSTGRES_DB:-tradingfactory}"]
      interval: 10s
      timeout: 5s
      retries: 10
    # Bound to loopback only: the worker and the dashboard reach Postgres over the compose
    # network, so there is no reason for the port to be reachable from the internet. Leave this
    # at 5432:5432 on a public VM and the database is one weak password away from being public.
    ports:
      - "127.0.0.1:5432:5432"

  worker:
    build:
      context: .
      dockerfile: harness/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER:-tf}:${POSTGRES_PASSWORD:-tf_local_password}@db:5432/${POSTGRES_DB:-tradingfactory}
      DATABASE_SSL: "false"
      HARNESS_ROLE: ${HARNESS_ROLE:-all}
      HARNESS_DRY_RUN: ${HARNESS_DRY_RUN:-false}
      HARNESS_MARKET_INTERVAL_MS: ${HARNESS_MARKET_INTERVAL_MS:-10000}
      HARNESS_FLOW_INTERVAL_MS: ${HARNESS_FLOW_INTERVAL_MS:-60000}
      HARNESS_NEWS_INTERVAL_MS: ${HARNESS_NEWS_INTERVAL_MS:-300000}
      HARNESS_NSE_ENABLED: ${HARNESS_NSE_ENABLED:-true}
      HARNESS_RSS_FEEDS: ${HARNESS_RSS_FEEDS:-}
      HARNESS_INDEX_UNIVERSE: ${HARNESS_INDEX_UNIVERSE:-NIFTY 50,BANK NIFTY,MIDCAP NIFTY}
      HARNESS_EQUITY_UNIVERSE: ${HARNESS_EQUITY_UNIVERSE:-RELIANCE,TCS,HDFCBANK}
      ANGEL_CLIENT_ID: ${ANGEL_CLIENT_ID:-}
      ANGEL_API_KEY: ${ANGEL_API_KEY:-}
      ANGEL_PASSWORD: ${ANGEL_PASSWORD:-}
      ANGEL_TOTP_SECRET: ${ANGEL_TOTP_SECRET:-}

      # Yahoo fallback quotes. Used only when Angel One is above is not configured.
      HARNESS_YAHOO_ENABLED: ${HARNESS_YAHOO_ENABLED:-true}
      HARNESS_YAHOO_TIMEOUT_MS: ${HARNESS_YAHOO_TIMEOUT_MS:-15000}
      HARNESS_YAHOO_SPACING_MS: ${HARNESS_YAHOO_SPACING_MS:-400}

      # Delivery and retention. `PUBLISH_MODE=shadow` writes the signal and the exact message but
      # sends nothing; flip to `live` per horizon once the household trusts the output.
      PUBLISH_MODE: ${PUBLISH_MODE:-shadow}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      TELEGRAM_API_ROOT: ${TELEGRAM_API_ROOT:-https://api.telegram.org}
      TELEGRAM_TIMEOUT_MS: ${TELEGRAM_TIMEOUT_MS:-10000}
      HARNESS_RETENTION_DAYS: ${HARNESS_RETENTION_DAYS:-90}

      # Optional LLM enrichment only. Never in the decision path; the rule engine stays
      # authoritative and the harness falls back to it on any error or quota exhaustion.
      HARNESS_LLM_ENABLED: ${HARNESS_LLM_ENABLED:-false}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER:-tf}:${POSTGRES_PASSWORD:-tf_local_password}@db:5432/${POSTGRES_DB:-tradingfactory}
      DATABASE_SSL: "false"
      WEB_DB_POOL: ${WEB_DB_POOL:-5}
    ports:
      - "3000:3000"

volumes:
  tf-db:
