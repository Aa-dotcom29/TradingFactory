# TLS-terminating reverse proxy for the dashboard.
#
# The session cookie is `Secure` under NODE_ENV=production, so plain HTTP silently breaks login:
# the browser refuses to send the cookie. This proxy exists so the dashboard is only ever reached
# over HTTPS.
#
# Certificates are read from /etc/nginx/certs, mounted read-only from ./nginx/certs by
# docker-compose.tls.yml. Generate them with the openssl command in docs/oracle-deploy.md.

worker_processes 1;

events {
    worker_connections 1024;
}

http {
    # nginx does not resolve Docker DNS at startup; do it per request instead so a restarted
    # `web` container is picked up without reloading nginx.
    resolver 127.0.0.11 valid=10s ipv6=off;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Plain HTTP exists only to redirect. Nothing is served over it.
    server {
        listen 80 default_server;
        server_name _;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name _;

        ssl_certificate     /etc/nginx/certs/tls.crt;
        ssl_certificate_key /etc/nginx/certs/tls.key;

        # The dashboard has no uploaded files, so a small ceiling is plenty and it stops the
        # proxy from buffering large bodies nobody sends.
        client_max_body_size 2m;

        location / {
            set $web "web";
            proxy_pass http://$web:3000;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # The worker polls on a 10s tick; give a poll enough room to be cancelled cleanly.
            proxy_read_timeout 120s;
        }
    }
}
